# Conceptual pay.sh-style spec for this demo.
# The runnable server is TypeScript (npm start); this YAML documents the paywall.

name: sky-sports-demo
subdomain: sky-sports
title: "Sky Sports Demo"
description: "Demo subscription access to sports highlights / live feed"
category: media
version: v1

routing:
  type: respond

operator:
  currencies:
    usd: ["USDC"]
  network: localnet
  fee_payer: true

endpoints:
  - method: GET
    path: "api/v1/live"
    resource: "sky-live"
    description: "Full Sky Sports live / highlights feed"
    subscription:
      period: "30d"
      price_usd: 14.99
      currency: USDC

  - method: GET
    path: "api/v1/live"
    resource: "sky-live:team:chelsea"
    description: "Micro-subscription: Chelsea matches only"
    subscription:
      period: "30d"
      price_usd: 2.99
      currency: USDC
      parent: sky-live

  - method: GET
    path: "api/v1/live"
    resource: "sky-live:team:arsenal"
    description: "Micro-subscription: Arsenal matches only"
    subscription:
      period: "30d"
      price_usd: 2.99
      currency: USDC
      parent: sky-live

  - method: GET
    path: "api/v1/live"
    resource: "sky-live:competition:premier-league"
    description: "Micro-subscription: Premier League fixtures"
    subscription:
      period: "30d"
      price_usd: 6.99
      currency: USDC
      parent: sky-live

  - method: GET
    path: "api/v1/live"
    resource: "sky-live:competition:formula-1"
    description: "Micro-subscription: Formula 1 only"
    subscription:
      period: "30d"
      price_usd: 4.99
      currency: USDC
      parent: sky-live
