# yaml-language-server: $schema=https://pay.sh/docs-assets/provider.schema.json
# Pay.sh paywall spec for this football package.
# The running demo uses @solana/pay-kit (same 402 stack). Optional:
#   npx @solana/pay --sandbox gate api sky-sports.yml --bind 127.0.0.1:1402
# only if you point routing at an ungated upstream — do not stack it on this server.

name: sky-sports-demo
subdomain: sky-sports
title: "Sky Sports football package"
description: "Pick any of 15 football matches and pay per report in USDC"
category: media
version: v1

routing:
  type: proxy
  url: http://127.0.0.1:1402/

operator:
  currencies:
    usd: ["USDC"]
  network: localnet
  fee_payer: true

endpoints:
  - method: GET
    path: "api/v1/matches"
    description: "Free weekend catalog"

  - method: GET
    path: "api/v1/matches/{id}"
    resource: "match-report"
    description: "Paid match report (pick one fixture)"
    metering:
      dimensions:
        - direction: usage
          unit: requests
          scale: 1
          tiers:
            - price_usd: 0.0049
